<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Calculadora CGE-SP</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <section class="hero">
      <p class="tag">CGE-SP</p>

      <h1>Calculadora de Salário Líquido (Auditor)</h1>

      <p class="subtitle">
        Simule o salário líquido do Auditor de Controle Interno da CGE-SP. Inclua descontos de IAMSPE, Previdências, pensão e outros descontos.
      </p>

      <img src="auditynho2.png" alt="Auditynho" class="hero-img">
    </section>

    <section class="card">
      <h2>Dados Básicos</h2>

      <div class="grid">
        <label>
          Ingresso no serviço público (Reforma RPPS)
          <select id="regimePrevidencia" onchange="calcular()">
            <option value="pos2013" selected>A partir de 21/01/2013</option>
            <option value="pre2013">Antes de 21/01/2013</option>
          </select>
        </label>

        <label>
  Nível
  <select id="nivel" onchange="calcular()">
    <option value="I" selected>I (inicial)</option>
    <option value="II">II</option>
    <option value="III">III</option>
    <option value="IV">IV (final)</option>
  </select>
</label>

<label>
  Categoria
  <select id="categoria" onchange="calcular()">
    <option value="1" selected>1 (inicial)</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4 (final)</option>
  </select>
</label>

        <label>
          IAMSPE (%)
          <select id="iamspe" onchange="calcular()">
  <option value="0">0% (não contribuir)</option>
  <option value="2" selected>2% (Títular menor que 59 anos)</option>
  <option value="3">3% (Títular maior que 59 anos)</option>
</select>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>Dados avançados</h2>

      <div class="grid">
        <label>
          Dependentes
          <input type="number" id="dependentes" value="0" min="0" oninput="calcular()">
        </label>

        <label>
          Pensão (%)
          <input type="number" id="pensao" value="0" min="0" step="0.1" oninput="calcular()">
        </label>

        <label>
          Outros descontos
          <input type="number" id="outros" value="0" min="0" step="0.01" oninput="calcular()">
        </label>
      </div>

      <hr>

      <h3>Previdência complementar</h3>

      <div class="grid">
        <label>
          Deseja contribuir?
          <select id="usaPrevComp" onchange="alternarPrevComp()">
            <option value="nao" selected>Não</option>
            <option value="sim">Sim</option>
          </select>
        </label>

        <label>
          Percentual (%)
          <input type="number" id="prevComp" value="0" min="0" max="7.5" step="0.1" oninput="calcular()">
        </label>

        <label>
          Teto do INSS
          <input type="text" value="R$ 8.475,55" disabled>
        </label>
      </div>

      <button type="button" onclick="calcular()">Calcular salário líquido</button>
    </section>

    <section class="result-card" id="resultado">
      <p>Preencha os dados e clique em calcular.</p>
    </section>

  </main>

  <script src="script.js"></script>

<div style="text-align:center; margin-top:30px;">
  <div class="powr-hit-counter" id="41080198"></div>
</div>

<script src="https://www.powr.io/powr.js?platform=html"></script>
  
</body>
</html>
