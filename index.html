<body>
  <main class="container">
    <section class="hero">
      <div>
        <p class="tag">CGE-SP</p>
        <h1>Calculadora de Salário Líquido</h1>
        <p class="subtitle">
          Simule subsídio, IR, IAMSPE, previdência, pensão e líquido com auxílio.
        </p>
      </div>
    </section>

    <section class="card">
      <h2>Dados da carreira</h2>

      <div class="grid">
        <label>
          Nível
          <select id="nivel"></select>
        </label>

        <label>
          Categoria
          <select id="categoria"></select>
        </label>

        <label>
          IAMSPE (%)
          <select id="iamspe">
            <option value="0">0%</option>
            <option value="0.5">0,5%</option>
            <option value="1">1%</option>
            <option value="1.5">1,5%</option>
            <option value="2" selected>2%</option>
            <option value="2.5">2,5%</option>
            <option value="3">3%</option>
          </select>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>Modo avançado</h2>

      <div class="grid">
        <label>
          Dependentes
          <input type="number" id="dependentes" value="0" min="0">
        </label>

        <label>
          Pensão alimentícia (%)
          <input type="number" id="pensao" value="0" min="0" step="0.1">
        </label>

        <label>
          Previdência complementar (%)
          <input type="number" id="prevComp" value="0" min="0" step="0.1">
        </label>

        <label>
          Outros descontos
          <input type="number" id="outros" value="0" min="0" step="0.01">
        </label>
      </div>

      <button onclick="calcular()">Calcular salário líquido</button>
    </section>

    <section class="result-card" id="resultado">
      <p>Preencha os dados e clique em calcular.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
