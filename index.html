<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Calculadora CGE-SP</title>

  <!-- Responsivo -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <!-- CAPA -->
    <section class="hero">
      <div>
        <p class="tag">CGE-SP</p>
        <h1>Calculadora de Salário Líquido</h1>
        <p class="subtitle">
          Simule salário líquido com IR, IAMSPE, previdência e pensão.
        </p>
      </div>
    </section>

    <!-- DADOS BÁSICOS -->
    <section class="card">
      <h2>Dados da carreira</h2>

      <div class="grid">
        <label>
          Nível
          <select id="nivel"></select>
        </label>

        <label>
          Categoria
          <select id="categoria"></select>
        </label>

        <label>
          IAMSPE (%)
          <select id="iamspe">
            <option value="0">0%</option>
    
            <option value="1">1%</option>
       
            <option value="2" selected>2%</option>
      
            <option value="3">3%</option>
          </select>
        </label>
      </div>
    </section>

    <!-- MODO AVANÇADO -->
    <section class="card">
      <h2>Modo avançado</h2>

      <div class="grid">
        <label>
          Dependentes
          <input type="number" id="dependentes" value="0" min="0">
        </label>

        <label>
          Pensão (%)
          <input type="number" id="pensao" value="0" min="0" step="0.1">
        </label>

        <label>
          Prev. Complementar (%)
          <input type="number" id="prevComp" value="0" min="0" step="0.1">
        </label>

        <label>
          Outros descontos
          <input type="number" id="outros" value="0" min="0" step="0.01">
        </label>
      </div>

      <button onclick="calcular()">Calcular salário líquido</button>
    </section>

    <!-- RESULTADO -->
    <section class="result-card" id="resultado">
      <p>Preencha os dados e clique em calcular.</p>
    </section>

  </main>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
