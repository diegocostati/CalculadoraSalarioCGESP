<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Calculadora CGE-SP</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <section class="hero">
      <p class="tag">CGE-SP</p>

      <h1>Calculadora de Salário Líquido</h1>

      <p class="subtitle">
        Simule salário líquido com IR, IAMSPE, previdência, pensão e previdência complementar.
      </p>

      <img src="auditynho2.png" alt="Auditynho" class="hero-img">
    </section>

    <section class="card">
      <h2>Dados da carreira</h2>

      <div class="grid">
        <label>
          Ingresso no serviço público
          <select id="regimePrevidencia" onchange="calcular()">
            <option value="pos2013" selected>A partir de 21/01/2013</option>
            <option value="pre2013">Antes de 21/01/2013</option>
          </select>
        </label>

        <label>
          Nível
          <select id="nivel" onchange="calcular()"></select>
        </label>

        <label>
          Categoria
          <select id="categoria" onchange="calcular()"></select>
        </label>

        <label>
          IAMSPE (%)
          <select id="iamspe" onchange="calcular()">
            <option value="0">0%</option>
            <option value="1">1%</option>
            <option value="2" selected>2%</option>
            <option value="3">3%</option>
          </select>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>Modo avançado</h2>

      <div class="grid">
        <label>
          Dependentes
          <input type="number" id="dependentes" value="0" min="0" oninput="calcular()">
        </label>

        <label>
          Pensão (%)
          <input type="number" id="pensao" value="0" min="0" step="0.1" oninput="calcular()">
        </label>

        <label>
          Outros descontos
          <input type="number" id="outros" value="0" min="0" step="0.01" oninput="calcular()">
        </label>
      </div>

      <hr>

      <h3>Previdência complementar</h3>

      <div class="grid">
        <label>
          Deseja contribuir?
          <select id="usaPrevComp" onchange="alternarPrevComp()">
            <option value="nao" selected>Não</option>
            <option value="sim">Sim</option>
          </select>
        </label>

        <label>
          Percentual (%)
          <input type="number" id="prevComp" value="0" min="0" max="7.5" step="0.1" oninput="calcular()">
        </label>

        <label>
          Teto do INSS
          <input type="text" value="R$ 8.475,55" disabled>
        </label>
      </div>

      <button type="button" onclick="calcular()">Calcular salário líquido</button>
    </section>

    <section class="result-card" id="resultado">
      <p>Preencha os dados e clique em calcular.</p>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
